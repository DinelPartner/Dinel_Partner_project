backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/din-elpartner # TODO: replace with the real "owner/repo" once the GitHub repo exists
  branch: main
  base_url: https://YOUR-VERCEL-DOMAIN.vercel.app # TODO: replace with the real production domain (hosts /api/auth + /api/callback)
  auth_endpoint: api/auth

media_folder: "public/blog-uploads"
public_folder: "/blog-uploads"

collections:
  - name: "blog"
    label: "Aktuellt / Blog"
    folder: "src/content/blog"
    create: true
    delete: true
    slug: "{{slug}}"
    i18n:
      # multiple_folders -> one subfolder per locale: src/content/blog/<locale>/<slug>.md
      # (matches the directory layout the Astro content collection already uses).
      structure: multiple_folders
      locales: ["sv", "en"]
      default_locale: "sv"
    fields:
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - { label: "Category", name: "category", widget: "string", i18n: true }
      - { label: "Excerpt", name: "excerpt", widget: "text", i18n: true }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", i18n: "duplicate" }
      - { label: "Image", name: "image", widget: "image", i18n: "duplicate" }
      - { label: "Published", name: "published", widget: "boolean", default: true, i18n: "duplicate" }
      - { label: "Body", name: "body", widget: "markdown", i18n: true }
